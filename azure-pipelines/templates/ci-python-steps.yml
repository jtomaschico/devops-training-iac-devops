# Template (Azure Pipelines) - CI Python (steps)

parameters:
  pythonImage: "python:3.10-slim"
  requirementsFile: "requirements.txt"
  testCommand: "pytest -q"

steps:
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.pythonImage }} \
        bash -c "
          python -m pip install --upgrade pip && \
          python -m pip install -r ${{ parameters.requirementsFile }} && \
          ${{ parameters.testCommand }} && \
          chown -R $(id -u):$(id -g) /workspace
        "
    displayName: "Install + Test + Fix permissions"
