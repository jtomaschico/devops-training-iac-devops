parameters:
  mavenImage: "maven:3.8.6-openjdk-11-slim"  # Imagen base con Maven y OpenJDK 11
  lintCommand: "make lint"  # Comando para ejecutar el lint
  testCommand: "make test"  # Comando para ejecutar los tests

steps:
  # Ejecutar todo en un solo `docker run`
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \  # Montamos el directorio de trabajo en el contenedor
        -w /workspace \  # Establecemos el directorio de trabajo dentro del contenedor
        ${{ parameters.mavenImage }} \  # Usamos la imagen base de Maven
        bash -c "
          apt-get update && apt-get install -y make && \  # Instalamos `make` solo una vez
          ${{ parameters.lintCommand }} && \  # Ejecutamos el comando de lint (make lint)
          ${{ parameters.testCommand }} && \  # Ejecutamos el comando de tests (make test)
          chown -R $(id -u):$(id -g) /workspace"  # Corregimos los permisos del workspace
    displayName: "Lint, Test y Corregir permisos"  # Nombre del paso
