parameters:
  mavenImage: "maven:3.8.6-openjdk-11-slim"
  lintCommand: "make lint"
  testCommand: "make test"

steps:
  - script: |
      docker run --rm -v $(pwd):/workspace -w /workspace ${{ parameters.mavenImage }} \
      sh -c "${{ parameters.lintCommand }}"
    displayName: "Lint"

  - script: |
      docker run --rm -v $(pwd):/workspace -w /workspace ${{ parameters.mavenImage }} \
      sh -c "${{ parameters.testCommand }}"
    displayName: "Test"
