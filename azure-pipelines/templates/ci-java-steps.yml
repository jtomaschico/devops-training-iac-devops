parameters:
  lintCommand: "make lint"
  testCommand: "make test"

steps:
  # Instalar make
  - script: |
      apt-get update && apt-get install -y make
    displayName: "Instalar Make"

  # Lint
  - script: |
      ${{ parameters.lintCommand }}
    displayName: "Lint"

  # Test
  - script: |
      ${{ parameters.testCommand }}
    displayName: "Test"
        

      
