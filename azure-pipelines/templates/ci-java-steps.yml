parameters:
  mavenImage: "maven:3.8.6-openjdk-11-slim"
  lintCommand: "make lint"
  testCommand: "make test"
  dockerImageName: $(IMAGE_NAME)

steps:
  # Ejecutar todo en un solo contenedor
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.mavenImage }} \
        bash -c "
          apt-get update && apt-get install -y make && \  # Instalamos `make` solo una vez
          ${{ parameters.lintCommand }} && \  # Ejecutamos el comando de lint (make lint)
          ${{ parameters.testCommand }} && \  # Ejecutamos el comando de tests (make test)
          chown -R $(id -u):$(id -g) /workspace"  # Corregimos los permisos del workspace
    displayName: "Lint, Test y Corregir permisos"

  # Build de la imagen Docker
  - script: |
      docker build -t ${{ parameters.dockerImageName }} .
    displayName: "Build Docker Image"  
