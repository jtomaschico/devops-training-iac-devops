parameters:
  mavenImage: "maven:3.8.6-openjdk-11-slim"
  lintCommand: "make lint"
  testCommand: "make test"

steps:
  # Instalar `make` solo una vez
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.mavenImage }} \
        bash -c "apt-get update && apt-get install -y make"
    displayName: "Instalar Make"
  
  # Ejecutar el comando de Lint
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.mavenImage }} \
        bash -c "${{ parameters.lintCommand }}"
    displayName: "Lint"
  
  # Ejecutar el comando de Test
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.mavenImage }} \
        bash -c "${{ parameters.testCommand }}"
    displayName: "Test"
  
  # Corregir permisos en el workspace
  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/workspace \
        -w /workspace \
        ${{ parameters.mavenImage }} \
        bash -c "chown -R $(id -u):$(id -g) /workspace"
    displayName: "Corregir permisos"
